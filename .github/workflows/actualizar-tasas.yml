name: Actualizar tasas de mercado

# Tesoro de EE. UU., inflación implícita de EE. UU. y bono colombiano a 10 años (FRED).
on:
  schedule:
    - cron: "23 12 * * 1"   # lunes 7:23 a. m. hora de Bogotá
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Descargar y regenerar datos_mercado.json
        run: python scripts/actualizar_tasas.py
      - name: Proponer cambios si hay datos nuevos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- datos_mercado.json; then echo "Sin cambios."; exit 0; fi
          rama="auto/tasas-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git add datos_mercado.json
          git commit -m "Actualiza tasas de mercado ($(date +%Y-%m-%d))"
          git push -f origin "$rama"
          gh pr create --base main --head "$rama" --title "Actualiza tasas de mercado ($(date +%Y-%m-%d))" \
            --body "Datos regenerados con scripts/actualizar_tasas.py (FRED). Revisa la variación de las tasas antes de fusionar: cambian el WACC de todas las empresas." \
            || echo "No se pudo abrir el PR automáticamente: ábrelo desde la rama $rama."
