name: Diagnóstico aportes
on:
  push:
    branches: [diag/aportes]
permissions:
  contents: write
jobs:
  valoracion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p out
          python diag/dcf_inverso.py > out/inverso.json 2> out/err.txt || true
          cd out && git init -q && git checkout -q -b diag/aportes-resultados
          git config user.name "diag-bot" && git config user.email "diag@users.noreply.github.com"
          git add -A && git commit -q -m "Resultados diagnóstico aportes"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag/aportes-resultados
