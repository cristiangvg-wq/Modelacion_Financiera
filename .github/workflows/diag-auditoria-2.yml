name: Diagnóstico auditoría 2
on:
  push:
    branches: [diag/auditoria-2]
permissions:
  contents: write
jobs:
  valoracion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: mkdir -p res && echo omitido > res/valoracion.json
      - run: python diag/filas_yahoo.py > res/filas_yahoo.json 2> res/filas_yahoo.err || true
      - run: python diag/flujos_yahoo.py > res/flujos_yahoo.json 2> res/flujos_yahoo.err || true
      - uses: actions/upload-artifact@v4
        with: {name: valoracion, path: res}
  versiones:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p res
          cp diag/versiones.py /tmp/versiones.py
          for c in f5a5a3e 856e2ad HEAD; do
            git worktree add -f /tmp/w_$c $c >/dev/null 2>&1
            echo "### $c" >> res/versiones.txt
            (cd /tmp/w_$c && python /tmp/versiones.py 2>/dev/null | tail -1) >> res/versiones.txt || true
          done
      - uses: actions/upload-artifact@v4
        with: {name: versiones, path: res}
  gemini:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p res
          if [ -z "$GEMINI_API_KEY" ]; then echo "SIN_SECRETO" > res/gemini.txt; else
            (python scripts/smoke_gemini_comite.py "ISA — Interconexión Eléctrica" 2>&1 | tail -80) > res/gemini.txt || true
            (python scripts/evaluar_comite_ia.py --vivo gemini 2>&1 | tail -40) >> res/gemini.txt || true
          fi
      - uses: actions/upload-artifact@v4
        with: {name: gemini, path: res}
  ui:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p res/ui
          streamlit run streamlit_app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > res/ui/streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
          python diag/capturas_ui.py http://127.0.0.1:8501 res/ui ambos || true
      - uses: actions/upload-artifact@v4
        with: {name: ui, path: res}
  publicar:
    needs: [valoracion]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: art}
      - run: |
          mkdir out && cp -r art/*/res/* out/ 2>/dev/null || cp -r art/* out/
          cd out && git init -q && git checkout -q -b diag/auditoria-2-resultados
          git config user.name "diag-bot" && git config user.email "diag@users.noreply.github.com"
          git add -A && git commit -q -m "Resultados diagnóstico auditoría 2"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag/auditoria-2-resultados
