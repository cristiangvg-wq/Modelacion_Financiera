name: Diagnóstico auditoría 4b
on:
  push:
    branches: [diag/auditoria-4b]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pypdf playwright && python -m playwright install --with-deps chromium
      - run: |
          set +e
          mkdir -p res/ui
          python diag/robustez_yahoo.py > res/robustez.json 2> res/robustez_err.txt
          python diag/valorar_activos.py ISA.CL > res/valoracion.json 2> res/valoracion_err.txt
          streamlit run streamlit_app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > res/ui/streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
          timeout 600 python diag/ui_excel.py http://127.0.0.1:8501 res/ui > res/ui/salida.txt 2>&1
          cd res && git init -q && git checkout -q -b diag/auditoria-4b-resultados
          git config user.name "diag-bot" && git config user.email "diag@users.noreply.github.com"
          git add -A && git commit -q -m "Resultados" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag/auditoria-4b-resultados
