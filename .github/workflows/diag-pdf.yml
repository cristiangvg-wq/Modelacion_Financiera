name: Diagnóstico PDF
on:
  push:
    branches: [diag/pdf]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          set +e
          mkdir -p out
          python diag/pdfs.py > out/log.txt 2> out/err.txt
          cd out && git init -q && git checkout -q -b diag/pdf-resultados
          git config user.name "diag-bot" && git config user.email "diag@users.noreply.github.com"
          git add -A && git commit -q -m "Resultados" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag/pdf-resultados
