name: Pruebas de calidad financiera

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verificar sintaxis
        run: |
          python -m py_compile modelacion_logic.py streamlit_app.py

      - name: Ejecutar pruebas automatizadas
        run: pytest -q
