name: Diag upside ISA
on:
  push:
    branches: [diag/isa-upside]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: |
          set +e
          mkdir -p out/ui
          streamlit run streamlit_app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > out/ui/streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
          python diag/sens_isa.py > out/sens.txt 2>&1
          cp Plantilla_EEFF_Modelacion_Financiera.xlsx out/ 2>/dev/null
          cd out && git init -q && git checkout -q -b diag/isa-upside-resultados
          git config user.name "diag-bot" && git config user.email "diag@users.noreply.github.com"
          git add -A && git commit -q -m "Resultados" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag/isa-upside-resultados
