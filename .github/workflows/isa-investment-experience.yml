name: ISA Investment Experience
on:
  pull_request:
    paths:
      - "presentation_web/**"
      - ".github/workflows/isa-investment-experience.yml"
  push:
    branches: [main]
    paths:
      - "presentation_web/**"
      - ".github/workflows/isa-investment-experience.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: presentation_web/package.json
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
