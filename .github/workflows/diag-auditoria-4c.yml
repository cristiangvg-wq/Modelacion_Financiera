name: Diagnóstico auditoría 4c
on:
  push:
    branches: [diag/auditoria-4c]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          set +e
          mkdir -p res
          python diag/robustez_yahoo.py > res/robustez.json 2> res/robustez_err.txt
          cd res && git init -q && git checkout -q -b diag/auditoria-4c-resultados
          git config user.name "diag-bot" && git config user.email "diag@users.noreply.github.com"
          git add -A && git commit -q -m "Resultados" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag/auditoria-4c-resultados
