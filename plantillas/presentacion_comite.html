<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presentación de comité</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<!--
  Plantilla de la presentación de comité (presentacion_comite.py).
  Solo LEE el snapshot incrustado: no calcula valores financieros, solo los formatea y dibuja.
  Funciona sin conexión; si las fuentes de Google no cargan, usa fuentes del sistema.
-->
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#16231D; --muted:#5B6A62; --line:#D5DCD6;
  --accent:#A32638; --accent-soft:#F4DDE0;
  --sup:#9A6A12; --sup-soft:#F5E9CF; --proy:#1F5F7A; --proy-soft:#DCEBF1;
  --good:#2D7A4B; --good-soft:#DCEFE3; --bad:#B23B2A; --bad-soft:#F6DCD7; --warn:#A8700B; --warn-soft:#F5EAD2;
  --bar:#33483E; --bar2:#9FB2A7;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --step:clamp(12px,1.05vw,15px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --panel:#16201B; --ink:#E4EBE6; --muted:#9AAAA1; --line:#2A3832;
  --accent:#E46476; --accent-soft:#3A1C22; --sup:#E0B25A; --sup-soft:#3A2E14; --proy:#6FB4D2; --proy-soft:#16303B;
  --good:#5BBE84; --good-soft:#173525; --bad:#E77A68; --bad-soft:#3E1D18; --warn:#E0AA45; --warn-soft:#3A2E14;
  --bar:#B7C9BF; --bar2:#52675C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --panel:#16201B; --ink:#E4EBE6; --muted:#9AAAA1; --line:#2A3832;
  --accent:#E46476; --accent-soft:#3A1C22; --sup:#E0B25A; --sup-soft:#3A2E14; --proy:#6FB4D2; --proy-soft:#16303B;
  --good:#5BBE84; --good-soft:#173525; --bad:#E77A68; --bad-soft:#3E1D18; --warn:#E0AA45; --warn-soft:#3A2E14;
  --bar:#B7C9BF; --bar2:#52675C; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--step);line-height:1.5;margin:0;overflow:hidden}
*{box-sizing:border-box}
.num,td,.tab{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;padding-block:clamp(18px,3.2vh,40px);padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);display:flex;flex-direction:column;gap:18px}
.slide[hidden]{display:none!important}
.slide.enter{animation:in .35s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.enter{animation:none}.wf-bar{transition:none!important}}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1,h2{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(34px,5.2vw,72px)}
h2{font-size:clamp(26px,3.2vw,44px);max-width:30ch}
.lead{color:var(--muted);max-width:72ch;margin:0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr));align-items:start}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:860px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.grid>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.panel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;text-transform:none;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-real{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.t-sup{background:var(--sup-soft);color:var(--sup)}
.t-proy{background:var(--proy-soft);color:var(--proy)}
.t-res{background:var(--accent-soft);color:var(--accent)}
.cover{justify-content:center}
.cover h1{max-width:18ch}
.meta-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;max-width:1000px;margin:10px 0 0}
.meta-list div{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.meta-list dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta-list dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.verdict{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end}
@media (max-width:860px){.verdict{grid-template-columns:1fr}}
.big{font-family:var(--f-display);font-size:clamp(52px,8.4vw,120px);line-height:.95;letter-spacing:-.01em}
.big small{font-family:var(--f-body);font-size:max(13px,.17em);color:var(--muted);letter-spacing:0;display:block;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{font-size:clamp(18px,1.9vw,26px);font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
.rangebar{position:relative;height:64px;margin:26px 8px 0}
.rangebar .track{position:absolute;left:0;right:0;top:24px;height:8px;background:var(--line);border-radius:4px}
.rangebar .fill{position:absolute;top:24px;height:8px;background:var(--bar);border-radius:4px}
.rangebar .mk{position:absolute;top:12px;width:2px;height:32px;transform:translateX(-1px)}
.rangebar .mk i{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-style:normal;font-weight:600}
.rangebar .mk.top i{top:-22px}.rangebar .mk.bot i{top:36px}
.mk.base{background:var(--ink)}.mk.px{background:var(--accent)}.mk.px i{color:var(--accent)}.mk.pes{background:var(--bad)}.mk.pes i{color:var(--bad)}
.disclaimer{font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;max-width:75ch;margin:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.wf{display:flex;align-items:stretch;gap:6px;height:270px;padding-top:22px;position:relative}
.wf-col{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer;background:none;border:0;padding:0}
.wf-plot{flex:1;position:relative}
.wf-zero{position:absolute;left:0;right:0;border-top:1px solid var(--muted)}
.wf-bar{position:absolute;left:8%;right:8%;border-radius:2px;transition:top .4s,height .4s}
.wf-bar.total{background:var(--bar)}.wf-bar.add{background:var(--good)}.wf-bar.sub{background:var(--bad)}
.wf-val{position:absolute;left:-20%;right:-20%;text-align:center;font-size:11px;font-weight:600;transform:translateY(-100%);padding-bottom:2px;white-space:nowrap}
.wf-scroll{overflow-x:auto}
.wf-lab{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-top:6px;height:44px;overflow:hidden;hyphens:auto}
.wf-col[aria-pressed="true"] .wf-lab{color:var(--ink);font-weight:700}
.wf-col[aria-pressed="true"] .wf-bar{outline:2px solid var(--accent);outline-offset:2px}
.detail{border-left:3px solid var(--accent);padding:4px 0 4px 12px;min-height:110px}
.detail h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.detail code{display:block;background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:4px;font-size:12px;margin:8px 0;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.detail p{margin:4px 0;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hm td{cursor:pointer;text-align:center;font-weight:600;border:2px solid var(--panel)}
.hm td.sel{outline:2px solid var(--ink);outline-offset:-2px}
.hm td.base-cell{text-decoration:underline;text-underline-offset:3px}
.hm th{text-align:center}
.readout{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-top:10px}
.readout b{font-family:var(--f-display);font-size:clamp(30px,3.4vw,46px);font-weight:500}
.split{display:flex;height:44px;border-radius:4px;overflow:hidden;font-size:12px;font-weight:600}
.split div{display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.gauge{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--good) 0 60%,var(--warn) 60% 75%,var(--bad) 75%);position:relative;margin:24px 0 8px}
.gauge b{position:absolute;top:-8px;width:3px;height:26px;background:var(--ink);transform:translateX(-1px)}
.gauge-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.checks li span:last-child{overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.fail{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.lvl{font-size:11px;color:var(--muted);font-weight:600;min-width:58px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:5px}
svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.pre{white-space:pre-wrap;margin:0;font-size:13px;color:var(--muted);max-height:260px;overflow:auto}
.bar{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);background:var(--panel);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;flex-wrap:wrap}
.bar .prog{flex:1;min-width:120px;height:3px;background:var(--line);border-radius:2px;position:relative}
.bar .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px;transition:width .3s}
.bar button{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
.bar button:hover{border-color:var(--ink)}
.bar .info{color:var(--muted);white-space:nowrap}
@media (max-width:640px){.bar .info.hide-sm,#btn-fs{display:none}}
.notes{border-top:1px dashed var(--line);background:var(--bg);padding:10px max(16px,env(safe-area-inset-left,0px));font-size:13px;max-height:28vh;overflow:auto}
.notes b{color:var(--accent)}
.index{position:absolute;inset:0;background:var(--bg);z-index:5;overflow:auto;padding:24px max(16px,env(safe-area-inset-left,0px),4vw)}
.index ol{columns:2 280px;padding-left:22px}
.index li{margin:6px 0;break-inside:avoid}
.index button{background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;font-size:15px}
.index button:hover{color:var(--accent)}
.nd{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<div class="app">
  <main class="stage" id="stage"></main>
  <div class="notes" id="notes" hidden></div>
  <nav class="bar" aria-label="Navegación de la presentación">
    <button id="prev" aria-label="Diapositiva anterior">←</button>
    <span class="info num" id="counter">1 / 1</span>
    <button id="next" aria-label="Diapositiva siguiente">→</button>
    <div class="prog" aria-hidden="true"><i id="progfill"></i></div>
    <span class="info hide-sm num" id="snapinfo"></span>
    <button id="btn-index" aria-expanded="false">Índice</button>
    <button id="btn-notes" aria-pressed="false">Notas</button>
    <button id="btn-fs">Pantalla completa</button>
  </nav>
</div>
<script>
"use strict";
const S = JSON.parse(document.getElementById('snapshot').textContent);
const M = S.meta, T = S.tesis, W = S.wacc || {}, TV = S.terminal || {}, PU = S.puente, SE = S.sensibilidad, P = S.proyeccion || [];
const MON = (M.moneda || '').toUpperCase();
const UNI = M.unidad_modelo || ('cifras en ' + (MON || 'moneda del modelo'));
const isNum = x => typeof x === 'number' && isFinite(x);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ND = '<span class="nd">N/D</span>';
const nf = d => new Intl.NumberFormat('es-CO', {minimumFractionDigits:d, maximumFractionDigits:d});
const n0 = nf(0), n1 = nf(1), n2 = nf(2);
const f0 = x => isNum(x) ? n0.format(x) : ND;
const f1 = x => isNum(x) ? n1.format(x) : ND;
const pct = (x, d=1) => isNum(x) ? (d === 2 ? n2 : d === 0 ? n0 : n1).format(x*100) + ' %' : ND;
const sgn = (x, d=1) => isNum(x) ? (x >= 0 ? '+' : '−') + pct(Math.abs(x), d) : ND;
const pxf = x => isNum(x) ? (MON + ' ' + (MON === 'COP' ? n0 : n2).format(x)) : ND;
const TAG = {
  real:'<span class="tag t-real">Dato de entrada</span>', sup:'<span class="tag t-sup">Supuesto</span>',
  proy:'<span class="tag t-proy">Proyección</span>', res:'<span class="tag t-res">Resultado del motor</span>'
};
const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const fails = (S.controles || []).filter(c => c.ok === false);
const warns = (S.controles || []).filter(c => c.ok === null);

/* Waterfall: solo geometría. Admite totales negativos; los pasos vienen con signo. */
function waterfall(container, steps, onPick, fmt){
  fmt = fmt || f0;
  if (!container.parentElement.classList.contains('wf-scroll')) { const w = document.createElement('div'); w.className = 'wf-scroll'; container.replaceWith(w); w.appendChild(container); }
  container.style.minWidth = (steps.length * 66) + 'px';
  let run = 0; const geo = [];
  steps.forEach(s => {
    if (s.kind === 'total') { geo.push([Math.min(0, s.v), Math.max(0, s.v)]); run = s.v; }
    else { const nxt = run + s.v; geo.push([Math.min(run, nxt), Math.max(run, nxt)]); run = nxt; }
  });
  const hi = Math.max(0, ...geo.map(g => g[1])), lo = Math.min(0, ...geo.map(g => g[0]));
  const span = (hi - lo) * 1.1 || 1, y = v => (hi * 1.05 - v) / span * 100;
  container.innerHTML = '';
  steps.forEach((s, i) => {
    const kind = s.kind === 'total' ? 'total' : (s.v >= 0 ? 'add' : 'sub');
    const b = el(`<button class="wf-col" aria-pressed="false" type="button"><div class="wf-plot"><div class="wf-zero"></div><div class="wf-bar ${kind}"></div><div class="wf-val num"></div></div><div class="wf-lab">${esc(s.label)}</div></button>`);
    const bar = b.querySelector('.wf-bar'), val = b.querySelector('.wf-val');
    const top = y(geo[i][1]), h = Math.max(y(geo[i][0]) - top, .6);
    bar.style.top = top + '%'; bar.style.height = h + '%'; val.style.top = top + '%';
    b.querySelector('.wf-zero').style.top = y(0) + '%';
    val.innerHTML = (kind === 'add' && s.kind !== 'total' ? '+' : kind === 'sub' && s.kind !== 'total' ? '−' : '') + fmt(s.kind === 'total' ? s.v : Math.abs(s.v));
    b.addEventListener('click', () => { container.querySelectorAll('.wf-col').forEach(c => c.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); onPick && onPick(s); });
    container.appendChild(b);
  });
}
const detailHTML = d => `<h4>${esc(d.label)} ${d.tag || ''}</h4><div class="num" style="font-size:20px;font-weight:600">${d.valor}</div>${d.formula ? `<code>${esc(d.formula)}</code>` : ''}<p>${esc(d.fuente || '')}</p>`;

const slides = [];
const add = (id, title, html, notes, init) => slides.push({id, title, html, notes, init});

/* 0 Portada */
add('portada', 'Portada', `
<section class="slide cover">
  <div class="eyebrow">Comité de valoración · ${esc(M.ticker || '')}</div>
  <h1>${esc(M.empresa)}</h1>
  <p class="lead">Valoración por flujo de caja descontado (FCFF). Todas las cifras provienen de una corrida del motor congelada en este archivo.</p>
  <dl class="meta-list">
    <div><dt>Unidades</dt><dd>${esc(UNI)} · valor por acción en ${esc(MON)}</dd></div>
    <div><dt>Corrida exportada</dt><dd class="num">${esc(M.generado)}</dd></div>
    <div><dt>Huella del snapshot</dt><dd class="num">${esc(M.hash)}</dd></div>
    <div><dt>Fuente financiera</dt><dd>${esc(M.fuente_financiera || 'N/D')}</dd></div>
    <div><dt>Precio de mercado</dt><dd>${esc(M.fuente_precio || 'N/D')}${M.fecha_precio ? ' · ' + esc(M.fecha_precio) : ''}</dd></div>
    <div><dt>Calidad de datos</dt><dd>${esc(M.nivel_calidad || 'N/D')}</dd></div>
  </dl>
</section>`,
`La huella <b>${esc(M.hash)}</b> identifica esta corrida: dos exportaciones con la misma huella tienen exactamente los mismos datos y supuestos. ${esc(M.calendario || '')}`);

/* 1 Tesis */
const ups = T.upside;
const titTesis = !isNum(ups) ? 'Valor intrínseco estimado por acción' :
  ups >= 0 ? `El valor estimado supera el precio de mercado en ${pct(ups)}` : `El precio de mercado supera el valor estimado en ${pct(-ups)}`;
add('tesis', 'Tesis de valor', `
<section class="slide">
  <div class="eyebrow">01 · Tesis ${TAG.res}</div>
  <h2>${titTesis}</h2>
  <div class="verdict">
    <div class="big num">${pxf(T.vps)}<small>valor intrínseco estimado por acción · DCF escenario base</small></div>
    <div class="kpis">
      <div class="kpi"><span>Precio de mercado</span><b class="num">${pxf(T.precio)}</b></div>
      <div class="kpi"><span>Upside / downside</span><b class="num ${isNum(ups) ? (ups >= 0 ? 'up' : 'down') : ''}">${sgn(ups)}</b></div>
      <div class="kpi"><span>Enterprise Value</span><b class="num">${f0(T.ev)}</b></div>
      <div class="kpi"><span>Equity Value</span><b class="num">${f0(T.equity)}</b></div>
    </div>
  </div>
  <div class="panel"><h3>Dónde queda el precio frente al modelo <span>valor por acción</span></h3><div class="rangebar" id="tesis-range"></div>
    <p class="lead" style="font-size:12px;margin-top:6px">Barra: rango de la matriz de sensibilidad WACC × g. Pesimista: escenario pesimista del motor (WACC + 1,5 pp y flujos estresados).</p></div>
  <p class="disclaimer">${esc(UNI)}. El valor intrínseco es una estimación que depende de los supuestos de esta presentación; no es un precio objetivo garantizado ni una orden de compra o venta.${T.nota_precio ? ' ' + esc(T.nota_precio) + '.' : ''}</p>
</section>`,
`Decisión del marco del motor: <b>${esc(T.decision_modelo || 'N/D')}</b>. Valor por acción ${pxf(T.vps)} frente a precio ${pxf(T.precio)}.`,
() => {
  const c = document.getElementById('tesis-range');
  const flat = SE ? SE.vps.flat().filter(isNum) : [];
  const pts = [T.vps, T.precio, T.vps_pesimista, ...flat].filter(isNum);
  if (!pts.length) { c.innerHTML = ND; return; }
  const lo = Math.min(...pts), hi = Math.max(...pts), pad = (hi - lo) * .06 || Math.abs(hi) * .1 || 1;
  const x = v => (v - (lo - pad)) / ((hi + pad) - (lo - pad)) * 100;
  let h = '<div class="track"></div>';
  if (flat.length) h += `<div class="fill" style="left:${x(Math.min(...flat))}%;width:${x(Math.max(...flat)) - x(Math.min(...flat))}%"></div>`;
  if (isNum(T.vps)) h += `<div class="mk base top" style="left:${x(T.vps)}%"><i>Base ${pxf(T.vps)}</i></div>`;
  if (isNum(T.precio)) h += `<div class="mk px bot" style="left:${x(T.precio)}%"><i>Precio ${pxf(T.precio)}</i></div>`;
  if (isNum(T.vps_pesimista)) h += `<div class="mk pes bot" style="left:${x(T.vps_pesimista)}%"><i>Pesimista ${pxf(T.vps_pesimista)}</i></div>`;

'Los ingresos, márgenes y flujos son proyecciones del motor a partir del histórico y los supuestos de la corrida; no son datos reportados.',
