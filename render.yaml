services:
  - type: web
    name: isa-scenario-engine
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && pip install -r scenario_api/requirements.txt
    startCommand: uvicorn scenario_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SCENARIO_API_TOKEN
        sync: false
